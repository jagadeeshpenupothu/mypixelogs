# Build settings stay in the Netlify dashboard; this file only adds headers.
# Lets Photopea (photopea.com) open our PSD files straight from the site.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Full music tracks and sound effects: "Download" saves the file instead of opening a player tab.
[[headers]]
  for = "/audio/music/*"
  [headers.values]
    Content-Disposition = "attachment"
[[headers]]
  for = "/audio/sfx/*"
  [headers.values]
    Content-Disposition = "attachment"
